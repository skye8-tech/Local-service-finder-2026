<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services page</title>
    <link rel="stylesheet" href="../Styles/style.css" />
    <link rel="stylesheet" href="./src/output.css" />
  </head>
  <body>
    <!--Header of the page-->
    <header id="header"></header>
    <main>
      <section
        class="professionals flex flex-col lg:flex-row gap-8 w-[92%] max-w-[1200px] mx-auto py-6"
      >
        <div
          class="professssionals-search w-full lg:w-[300px] shrink-0 bg-gray-50 p-5 rounded-lg border border-gray-100 h-fit"
        >
          <form>
            <h3>Refine Search</h3>
            <h5>TRADE CATEGORY</h5>
            <div class="trade-select-wrapper">
              <select
                id="trade-filter"
                name="trade_category"
                class="filter-dropdown"
              >
                <option value="" disabled selected hidden>
                  Choose trade...
                </option>
                <option value="plumbing">Plumbing</option>
                <option value="electrical">Electrical</option>
                <option value="carpentry">Carpentry</option>
                <option value="cleaning">House Cleaning</option>
              </select>
            </div>

            <h5>PRICE RANGE</h5>
            <div class="price-professionals">
              <div>
                <input type="text" placeholder="FCFA Min" id="minprice" />
              </div>
              <div>
                <input type="text" placeholder="FCFA Max" id="maxprice" />
              </div>
            </div>

            <h5>MAXIMUM RATING</h5>
            <div class="price-rating">
              <button>4+</button>
              <button>3+</button>
            </div>
            <div class="price-submit">
              <input type="submit" value="Apply Filters" id="price-filters" />
            </div>
          </form>
        </div>
        <div class="professionals-trade">
          <div class="professionals-trade-header">
            <div>
              <h1>Trade Professionals</h1>
              <p>Showing 12 verified professionals</p>
            </div>
          </div>
          <div
            class="professionals-trade-cards"
            id="cards-build"
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-6 flex-grow"
          ></div>
          <div class="pagination">
            <button class="page-num active">1</button>
            <button class="page-num">2</button>
            <button class="page-num">3</button>
          </div>
        </div>
      </section>
    </main>

    <div id="profile-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <button id="close-modal-btn" class="close-btn">&times;</button>

        <div class="modal-header">
          <img
            id="modal-worker-img"
            src=""
            alt="Worker Profile"
            class="modal-avatar"
          />
          <div>
            <h2 id="modal-worker-name">Worker Name</h2>
            <p id="modal-worker-tags" class="modal-tags">Tags</p>
            <div class="modal-rating">
              ⭐ <span id="modal-worker-rating">0.0</span>
            </div>
          </div>
        </div>

        <div class="modal-body">
          <h3>About Me</h3>
          <p id="modal-worker-desc">Worker details will load here...</p>

          <div class="modal-pricing-box">
            <span>Base Consultation Rate:</span>
            <strong id="modal-worker-rate">FCFA 0</strong>
          </div>
        </div>

        <div class="modal-footer">
          <h3>Secure Payment</h3>
          <p class="payment-note">
            Complete payment to finalize your booking assignment.
          </p>
          <button id="pay-now-btn" class="payment-submit-btn">
            Pay with Mobile Money / Orange Money
          </button>
        </div>
      </div>
    </div>
    <!--Footer of the page-->
    <footer id="footer"></footer>
  </body>
  <script src="../Scripts/header-footer.js"></script>
  <script src="../Scripts/service-data.js"></script>
  <script src="../Scripts/filter.js"></script>
  <script src="../Scripts/service-cards.js"></script>
</html>
