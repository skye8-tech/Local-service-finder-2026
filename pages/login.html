<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login form</title>
    <link rel="stylesheet" href="../src/output.css" />
    <link rel="stylesheet" href="../Styles/style.css" />
  </head>
  <body
    class="bg-[#FBF9F9] font-serif min-h-screen flex items-center justify-center"
  >
    <section
      class="w-full flex flex-col items-center font-sans max-w-md mx-auto my-12 px-6 py-8"
    >
      <div
        class="flex flex-flow flex-col items-center align-middle text-center"
      >
        <h4 class="text-[#735C00] font-extrabold">FixItLocal</h4>
        <p>Refined Reliability for Local Services</p>
      </div>
      <div class="mb-0">
        <div class="bg-white border border-t-0 w-full p-8 mt-0">
          <div class="text-center mb-6">
            <h1>Welcome Back</h1>
            <p>Sign in to book and manage your premium</p>
          </div>

          <form id="loginForm" class="flex flex-col items-center gap-4 w-full">
            <div class="flex gap-4">
              <label
                class="flex-1 flex items-center gap-2 p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 select-none"
              >
                <input
                  type="radio"
                  name="role"
                  value="customer"
                  class="w-4 h-4 text-gray-900 border-gray-300 accent-gray-900 cursor-pointer rounded-xl"
                  checked
                />
                <span class="text-sm font-medium text-gray-900">Customer</span>
              </label>

              <label
                class="flex-1 flex items-center gap-2 p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 select-none"
              >
                <input
                  type="radio"
                  name="role"
                  value="worker"
                  class="w-4 h-4 text-gray-900 border-gray-300 accent-gray-900 cursor-pointer rounded-xl"
                />
                <span class="text-sm font-medium text-gray-900">Worker</span>
              </label>
            </div>

            <div class="w-72 flex flex-col">
              <label for="A1">EMAIL ADDRESS</label>
              <input
                type="email"
                id="A1"
                placeholder="name@example.com"
                class="bg-[var(--tertiary-color)] p-1 w-72 rounded-[3px]"
              />
              <p
                id="error-email"
                class="hidden text-xs text-red-500 mt-1 font-medium text-left w-72"
              ></p>
            </div>
            <div class="w-72 flex flex-col">
              <label for="p1">PASSWORD</label>
              <input
                type="password"
                id="p1"
                placeholder="••••••••"
                class="bg-[var(--tertiary-color)] p-1 w-72 rounded-[3px]"
              />
              <p
                id="error-password"
                class="hidden text-xs text-red-500 mt-1 font-medium text-left w-72"
              ></p>
            </div>
            <div>
              <input type="checkbox" id="terms" class="border border-black" />
              I agree to the
              <a href="term/policy.html" class="text-[#735C00] underline"
                >Terms Policy</a
              >
              <p
                id="error-terms"
                class="hidden text-xs text-red-500 mt-1 font-medium text-left w-72"
              ></p>
            </div>
            <div class="text-center items-center">
              <input
                type="submit"
                value="Login"
                class="bg-[var(--tertiary-color)] border border-none p-1 w-[80px] h-[40px] hover:bg-[var(--secondary-color)] rounded-[3px]"
              />
            </div>
          </form>
        </div>
      </div>
    </section>
    <script src="../Scripts/login.js"></script>
  </body>
</html>
